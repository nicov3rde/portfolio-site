<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #080808; -webkit-font-smoothing: antialiased; }
    ::selection { background: #00cc00; color: #000; }
    a { color: #00cc00; text-decoration: none; }
    a:hover { color: #33dd33; }
  </style>
</helmet>

<div style="background:#080808;color:#f2f2f0;font-family:'Inter',sans-serif;min-height:100vh">
  <header style="position:sticky;top:0;z-index:20;background:rgba(8,8,8,0.9);backdrop-filter:blur(10px);border-bottom:1px solid #1e1e1e;padding:22px clamp(20px,4vw,64px)">
    <a href="index.html#hero" style="font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(242,242,240,0.6);font-weight:600">&#8592; Back to Nico Verde</a>
  </header>

  <section style="padding:70px clamp(20px,4vw,64px) 0">
    <div style="max-width:900px;margin:0 auto">
      <p style="font-size:12px;letter-spacing:0.25em;text-transform:uppercase;color:rgba(0,204,0,0.6);margin:0 0 14px;font-weight:600">Writing</p>
      <h1 style="font-family:'Bebas Neue',sans-serif;font-size:clamp(2.4rem,6vw,4.5rem);text-transform:uppercase;margin:0 0 50px;color:#f2f2f0">Essays &amp; Guides</h1>
      <div style="display:flex;flex-direction:column">
        <sc-for list="{{ writingPieces }}" as="p" hint-placeholder-count="6">
          <a href="{{ p.href }}" style="padding:22px 0;border-top:1px solid #1e1e1e;display:flex;flex-direction:column;gap:6px;color:inherit;text-decoration:none">
            <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
              <h3 style="font-family:'Bebas Neue',sans-serif;font-size:1.3rem;text-transform:uppercase;margin:0;color:#f2f2f0">{{ p.title }}</h3>
              <span style="font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(242,242,240,0.3)">{{ p.date }}</span>
            </div>
            <p style="font-size:13px;line-height:1.6;color:rgba(242,242,240,0.5);margin:0">{{ p.excerpt }}</p>
          </a>
        </sc-for>
      </div>
    </div>
  </section>

  <footer style="padding:60px clamp(20px,4vw,64px);border-top:1px solid #1e1e1e;margin-top:40px;text-align:center">
    <a href="index.html#hero" style="font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(242,242,240,0.6);font-weight:600">&#8592; Back to Nico Verde</a>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  writingPieces = [
    { title: "Instagram Marketing Guide", excerpt: "So you want to have the best marketing videos on Instagram? Here are the 6 components of every viral Reel.", date: "2026", href: "Essay-Instagram-Guide.html" },
    { title: "The True Art of Atlanta", excerpt: "While walking in Atlanta about a month ago, I saw a man spray-painting a building on Auburn Avenue.", date: "2025", href: "Essay-Atlanta-Art.html" },
    { title: "Drugs: Gateway to Misery or Portal to Unseen Creativity?", excerpt: "From opium-fueled Paris salons to the psychedelic revolution of the 1960s, artists have sought chemical pathways to innovation.", date: "2025", href: "Essay-Drugs-Creativity.html" },
    { title: "Kudzu", excerpt: "I guess I noticed when it grabbed my foot, although I had seen it much before. Squeezing me, growing tighter by the day.", date: "Oct 28, 2025", href: "Essay-Kudzu.html" },
    { title: "The Relationship Between AI and Coursework", excerpt: "A marketing research project for Georgia State University examining how students' AI use relates to grades, attitudes, and learning.", date: "Nov 2025", href: "Essay-AI-Coursework.html" },
    { title: "Are We Alone?", excerpt: "All throughout mankind's existence we have looked to the stars for proof of other life out there in the universe.", date: "Feb 9, 2024", href: "Essay-Are-We-Alone.html" },
  ];

  renderVals() {
    return { writingPieces: this.writingPieces };
  }
}

</script>
</body>
</html>
