<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vine Loop Background</title>
<style>
  :root{
    --bg:#050705;
    --vine-dim:#1f6b3a;
    --vine-bright:#4fe07a;
    --leaf:#4fe07a;
    --dur:12s;
  }
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:var(--bg);
    overflow:hidden;
  }
  .vine-bg{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    display:block;
  }
  .vine{
    fill:none;
    stroke:url(#vineGradient);
    stroke-linecap:round;
    stroke-dasharray:100;
    stroke-dashoffset:100;
    opacity:0;
    filter:url(#vineGlow);
    animation:drawVine var(--dur) ease-in-out infinite;
  }
  .leaf{
    fill:var(--leaf);
    opacity:0;
    filter:url(#vineGlow);
    transform-box:fill-box;
    transform-origin:center;
    animation:pulseLeaf var(--dur) ease-in-out infinite;
  }

  @keyframes drawVine{
    0%   { stroke-dashoffset:100; opacity:0; }
    6%   { opacity:.85; }
    42%  { stroke-dashoffset:0;   opacity:.85; }
    58%  { stroke-dashoffset:0;   opacity:.85; }
    94%  { stroke-dashoffset:100; opacity:0; }
    100% { stroke-dashoffset:100; opacity:0; }
  }

  @keyframes pulseLeaf{
    0%, 38% { opacity:0; transform:scale(0); }
    46%     { opacity:.9; transform:scale(1); }
    54%     { opacity:.9; transform:scale(1); }
    62%, 100%{ opacity:0; transform:scale(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .vine, .leaf{ animation:none; opacity:.25; stroke-dashoffset:0; transform:scale(1); }
  }
</style>
</head>
<body>

    <defs>
      <linearGradient id="vineGradient" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%"  stop-color="var(--vine-dim)"/>
        <stop offset="100%" stop-color="var(--vine-bright)"/>
      </linearGradient>
      <filter id="vineGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2.2" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <g transform="">

      <ellipse cx="50" cy="770" rx="4" ry="2.2" transform="rotate(70 50 770)" class="leaf" style="animation-delay:0.00s"/>

      <ellipse cx="260" cy="470" rx="7" ry="3.8500000000000005" transform="rotate(-20 260 470)" class="leaf" style="animation-delay:1.50s"/>
      <ellipse cx="20" cy="590" rx="5.5" ry="3.0250000000000004" transform="rotate(40 20 590)" class="leaf" style="animation-delay:2.35s"/>
      <ellipse cx="258" cy="398" rx="6" ry="3.3000000000000003" transform="rotate(-60 258 398)" class="leaf" style="animation-delay:3.05s"/>
