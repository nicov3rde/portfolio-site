<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vine Loop Background</title>
<style>
  :root{
    --bg:#050705;
    --vine-dim:#1c6b39;
    --vine-bright:#5fef8c;
    --leaf:#3fcf72;
    --dur:14s;
  }
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:var(--bg);
    overflow:hidden;
  }
  .vine-bg{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    display:block;
  }
  .vine, .tendril{
    fill:none;
    stroke:url(#vineGradient);
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:100;
    stroke-dashoffset:100;
    opacity:0;
    filter:url(#vineGlow);
    animation:drawVine var(--dur) ease-in-out infinite;
  }
  .tendril{
    opacity:0;
  }
  .leaf{
    fill:var(--leaf);
    opacity:0;
    filter:url(#vineGlow);
    transform-box:fill-box;
    transform-origin:0px 0px;
    animation:pulseLeaf var(--dur) ease-in-out infinite;
  }

  @keyframes drawVine{
    0%   { stroke-dashoffset:100; opacity:0; }
    6%   { opacity:.9; }
    42%  { stroke-dashoffset:0;   opacity:.9; }
    58%  { stroke-dashoffset:0;   opacity:.9; }
    94%  { stroke-dashoffset:100; opacity:0; }
    100% { stroke-dashoffset:100; opacity:0; }
  }

  @keyframes pulseLeaf{
    0%, 36% { opacity:0; transform:scale(0); }
    46%     { opacity:.95; transform:scale(1); }
    54%     { opacity:.95; transform:scale(1); }
    64%, 100%{ opacity:0; transform:scale(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .vine, .tendril, .leaf{ animation:none; opacity:.22; stroke-dashoffset:0; transform:scale(1); }
  }
</style>
</head>
