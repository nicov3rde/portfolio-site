<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vine Loop Background</title>
<style>
  :root{
    --bg:#050705;
    --vine-dim:#1c6b39;
    --vine-bright:#57e884;
    --leaf:#4fe07a;
    --dur:13s;
  }
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:var(--bg);
    overflow:hidden;
  }
  .vine-bg{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    display:block;
  }
  .vine{
    fill:none;
    stroke:url(#vineGradient);
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:100;
    stroke-dashoffset:100;
    opacity:0;
    filter:url(#vineGlow);
    animation:drawVine var(--dur) ease-in-out infinite;
  }
  .leaf{
    fill:var(--leaf);
    opacity:0;
    filter:url(#vineGlow);
    transform-box:fill-box;
    transform-origin:0px 0px;
    animation:pulseLeaf var(--dur) ease-in-out infinite;
  }

  @keyframes drawVine{
    0%   { stroke-dashoffset:100; opacity:0; }
    6%   { opacity:.88; }
    42%  { stroke-dashoffset:0;   opacity:.88; }
    58%  { stroke-dashoffset:0;   opacity:.88; }
    94%  { stroke-dashoffset:100; opacity:0; }
    100% { stroke-dashoffset:100; opacity:0; }
  }

  @keyframes pulseLeaf{
    0%, 36% { opacity:0; transform:scale(0); }
    46%     { opacity:.92; transform:scale(1); }
    54%     { opacity:.92; transform:scale(1); }
    64%, 100%{ opacity:0; transform:scale(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .vine, .leaf{ animation:none; opacity:.22; stroke-dashoffset:0; transform:scale(1); }
  }
</style>
</head>
